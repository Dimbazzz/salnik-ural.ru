title: Промышленный каталог — ТЗ и документация
description: Единое ТЗ, шаблон template-product, адаптер, schema, HowTo
lang: ru

# GitHub Pages
# baseurl: /REPO_NAME   # раскомментируйте, если сайт = username.github.io/REPO_NAME
# url: https://USERNAME.github.io

remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
